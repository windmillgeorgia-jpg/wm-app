<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>WINDMILL</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WINDMILL">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0e1116">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<style>
  html,body{margin:0;height:100%;background:#0e1116;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#0e1116}
  .load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#8b95a5;font:600 14px system-ui,sans-serif;letter-spacing:2px}
  .load img{width:72px;height:72px;border-radius:16px;animation:p 1.2s ease-in-out infinite}
  @keyframes p{50%{opacity:.4}}
</style>
</head>
<body>
<div class="load" id="load"><img src="icon-192.png" alt=""><div>WINDMILL</div></div>
<iframe id="app"
  allow="clipboard-write; web-share" title="WINDMILL"></iframe>
<script>
  var EXEC = 'https://script.google.com/macros/s/AKfycbwI1PV4pge5RH0YIXJwgXLPuMy8BORaf-UXxpJee8SltCi0LW4pPmho71fDVdgqS5Zg/exec';
  var tk = '';
  try { tk = localStorage.getItem('wm_token') || ''; } catch (e) {}
  document.getElementById('app').src = EXEC + (tk ? '?t=' + encodeURIComponent(tk) : '');
  window.addEventListener('message', function (e) {
    var host = '';
    try { host = new URL(e.origin).hostname; } catch (x) { return; }
    if (!/\.googleusercontent\.com$/.test(host)) return;
    var d = e.data;
    if (!d || d.wm !== 'token') return;
    try { if (d.t) localStorage.setItem('wm_token', d.t); else localStorage.removeItem('wm_token'); } catch (x) {}
  });
  document.getElementById('app').addEventListener('load', function(){ setTimeout(function(){ document.getElementById('load').style.display='none'; }, 300); });
</script>
</body>
</html>
